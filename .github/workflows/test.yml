name: Test

on:
  push:
    paths:
      - '**.py'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 迁出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
    - name: 安装依赖
      run: |
        pip install -r requirements.txt
        pip install pytest ruff
    - name: Ruff 检查（错误级）
      run: ruff check fetch.py dynamic.py --select F
    - name: 运行测试
      run: pytest tests/ -q
